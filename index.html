
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Invitación digital de los quince años de Giuliana.">
    <meta name="theme-color" content="#ffffff">

    <title>Giuliana | Mis Quince</title>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <main class="revista">

        <!-- PORTADA -->
        <section class="portada" id="portada">

            <!-- Fotografía principal -->
            <div class="portada__fotografia">
                <img
                    src="assets/img/portada.png"
                    alt="Giuliana en su portada de quince años"
                    class="portada__imagen"
                >
            </div>

            <!-- Título vertical -->
            <h1 class="portada__titulo">
                MIS QUINCE
            </h1>

            <!-- Nombre y fecha -->
            <div class="portada__datos">
                <h2 class="portada__nombre">
                    Giuliana
                </h2>

                <p class="portada__fecha">
                    22/12/2027
                </p>
            </div>

            <!-- Botón para pasar la página -->
            <button
                class="portada__pasar"
                id="pasarPagina"
                type="button"
                aria-label="Pasar a la siguiente página"
            >
                <span></span>
            </button>

        </section>

        <!-- PRIMERA PÁGINA INTERIOR -->
        <section class="pagina-detalles" id="detalles">

            <img
                src="assets/img/detalles.png"
                alt=""
                class="pagina-detalles__imagen"
            >

        </section>

    </main>

    <script src="assets/js/main.js"></script>

</body>

</html>
