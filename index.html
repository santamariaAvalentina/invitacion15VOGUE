<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Invitación digital de los quince años de Martina.">
    <meta name="theme-color" content="#ffffff">

    <link rel="icon" type="image/png" href="./assets/img/favicon.png?v=1">

    <title>Martina | Mis Quince</title>

    <!-- Tipografía editorial estilo Vogue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&display=swap"
        rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <main class="revista">

        <!-- PORTADA -->
        <section class="portada" id="portada">

            <!-- Fotografía principal -->
            <div class="portada__fotografia">
                <img src="assets/img/portada.png" alt="Martina en su portada de quince años" class="portada__imagen">
            </div>

            <!-- Título vertical -->
            <h1 class="portada__titulo">
                MIS QUINCE
            </h1>

            <!-- Nombre y fecha -->
            <div class="portada__datos">
                <h2 class="portada__nombre">
                    Martina
                </h2>

                <p class="portada__fecha">
                    22/01/2027
                </p>
            </div>

            <!-- Botón para pasar la página -->
            <button class="portada__pasar" id="pasarPagina" type="button" aria-label="Pasar a la siguiente página">
                <span></span>
            </button>

        </section>

        <!-- PRIMERA PÁGINA INTERIOR -->
        <section class="pagina-detalles" id="detalles">

            <img src="assets/img/detalles.png" alt="" class="pagina-detalles__imagen">

            <!-- Composición editorial -->
            <div class="pagina-detalles__contenido">

                <h2 class="pagina-detalles__nombre">
                    MARTINA
                </h2>

                <p class="pagina-detalles__titulo">
                    THE NIGHT EDITION
                </p>


                <p class="pagina-detalles__frase">
                    Una celebración extraordinaria...
                    Una noche inolvidable.....
                </p>
                

                <p class="pagina-detalles__mensaje">
                    Reservamos un lugar especial para vos.
                </p>

            </div>

        </section>

<
<!-- SEGUNDA PÁGINA INTERIOR -->
<section class="pagina-evento" id="pagina2">

    <!-- Fotografía del salón -->
    <div class="pagina-evento__fotografia">
        <img
            src="assets/img/evento.png"
            alt="Salón Altos Evento"
            class="pagina-evento__imagen"
        >
    </div>

    <!-- Capa para integrar la fotografía -->
    <div class="pagina-evento__degradado"></div>

    <!-- Contenido editorial -->
    <div class="pagina-evento__contenido">

        <p class="pagina-evento__encabezado">
            THE CELEBRATION
        </p>

        <p class="pagina-evento__fecha">
            22 DE ENERO
        </p>

        <h2 class="pagina-evento__anio">
            2027
        </h2>

        <p class="pagina-evento__salon">
            TE ESPERAMOS
        </p>

        <p class="pagina-evento__contador-titulo">
            LA CUENTA REGRESIVA COMIENZA
        </p>

        <!-- CONTADOR -->
        <div class="pagina-evento__contador" id="contador">

            <div>
                <span id="dias">00</span>
                <small>DÍAS</small>
            </div>

            <div>
                <span id="horas">00</span>
                <small>HORAS</small>
            </div>

            <div>
                <span id="minutos">00</span>
                <small>MINUTOS</small>
            </div>

            <div>
                <span id="segundos">00</span>
                <small>SEGUNDOS</small>
            </div>

        </div>

        <!-- UBICACIÓN -->
        <a
            class="pagina-evento__ubicacion"
            href="https://maps.app.goo.gl/B1DLFRH6KfibvDQp9"
            target="_blank"
            rel="noopener noreferrer"
        >
            VER UBICACIÓN
        </a>

    </div>

</section>

    </main>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>

</body>

</html>
